# nginx vhost for mindsai.tech on the Hostinger VPS -> /etc/nginx/sites-available/mindsai.tech
# Routing (longest prefix wins):
#   /portal      -> portal container (static SPA, base '/portal')   :3002
#   /signin      -> redirect to /portal (legacy URL)
#   /server      -> Bun/Hono API (basePath '/server', no prefix strip) :4000
#   /academy-app -> academy SPA container                            :3003
#   /academy-api -> academy Express API (prefix IS stripped)         :5000
#   /            -> Next.js landing + Payload (/admin, /api/*)       :3001
# NOTE: do not route /api to the Bun server - /api/* belongs to Payload.

server {
    listen 80;
    listen [::]:80;
    server_name mindsai.tech www.mindsai.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mindsai.tech www.mindsai.tech;

    ssl_certificate /etc/letsencrypt/live/mindsai.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindsai.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location = /signin { return 301 /portal; }
    location ^~ /signin/ { return 301 /portal; }

    location /portal {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /academy-app {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /academy-api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /server {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
