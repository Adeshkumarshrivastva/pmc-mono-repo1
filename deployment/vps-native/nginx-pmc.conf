# nginx vhost replacing Traefik. Install to /etc/nginx/sites-available/pmc,
# then symlink into sites-enabled. Certbot rewrites this file to add the
# :443 server block and the http->https redirect — run it AFTER installing this.
#
# Routing mirrors docker-compose.prod.yml's Traefik labels exactly:
#   /portal      -> static SPA build   (was: portal container, priority 10)
#   /server      -> 127.0.0.1:4000     (was: server container, priority 10)
#   /academy-app -> static SPA build   (new: apps/academy client)
#   /academy-api -> 127.0.0.1:5000     (new: apps/academy Express backend)
#   /            -> 127.0.0.1:3000     (was: landing-page container, priority 1)
# Note /academy (no suffix) is NOT listed: it is a Next.js CMS page and is meant
# to fall through to the landing page below.
# nginx picks the longest matching prefix, which reproduces Traefik's priorities.

server {
    listen 80;
    listen [::]:80;
    server_name srv1909662.hstgr.cloud;

    # Payload media and server file uploads. nginx defaults to 1m, which would
    # reject uploads that worked fine through Traefik (no such limit there).
    client_max_body_size 50M;

    root /var/www/pmc;

    access_log /var/log/nginx/pmc.access.log;
    error_log  /var/log/nginx/pmc.error.log;

    # ---- portal: Vite SPA, built with base '/portal' ----
    # Files live at /var/www/pmc/portal/, so the URL prefix and the directory
    # name line up and a plain `root` works — no `alias` needed.
    # try_files falls back to the SPA shell so client-side routes deep-link.
    location /portal {
        try_files $uri $uri/ /portal/index.html;
    }

    # Hashed Vite assets are immutable — cache them hard.
    location /portal/assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- academy course app: Vite SPA, built with base '/academy-app' ----
    # Published to /var/www/pmc/academy-app/, so prefix and directory line up and
    # a plain `root` works, same as /portal above.
    location /academy-app {
        try_files $uri $uri/ /academy-app/index.html;
    }

    location /academy-app/assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- academy backend: Express/Mongoose API on :5000 ----
    # Unlike /server, this one DOES strip its prefix: the Express app mounts its
    # routers at /api/*, with no knowledge of /academy-api. The trailing slash on
    # both the location and the proxy_pass target is what performs the strip, so
    # /academy-api/api/payment/verify reaches the backend as /api/payment/verify.
    # The prefix exists because a bare /api is already taken by Payload on the
    # landing page.
    location /academy-api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- server: Bun/Hono API ----
    # No prefix stripping: apps/server/src/app.ts sets .basePath('/server') and
    # better-auth mounts at /server/auth, so the API expects to see /server itself.
    location /server {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # better-auth needs this to know the request was HTTPS, or it will refuse
        # to set Secure session cookies behind the proxy.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- landing page: Next.js + Payload admin — catches everything else ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Next.js build assets are content-hashed and immutable.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
